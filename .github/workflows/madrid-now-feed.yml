name: Update Madrid Now Feed

on:
  push:
    paths:
      - "madrid-now-feed/collect.py"
      - ".github/workflows/madrid-now-feed.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: madrid-now-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect verified news
        run: python madrid-now-feed/collect.py

      - name: Publish feed when stories change
        shell: bash
        run: |
          if git diff --quiet -- madrid-now-feed/news.json; then
            echo "No feed change to publish."
            exit 0
          fi
          git config user.name "Madrid Now Bot"
          git config user.email "actions@users.noreply.github.com"
          git add madrid-now-feed/news.json
          git commit -m "Update Madrid Now verified news"
          git push
